name: Tracking quality
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracking:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tracking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tracking/requirements-study.txt
      - run: python -m pip install -r requirements-study.txt pyinstaller
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bin tests tools
      - run: git diff --check
      - name: Build Linux
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm bin/mediapipepose_linux.spec
      - name: Check Linux executable
        if: runner.os == 'Linux'
        run: ./dist/mediapipepose/mediapipepose --check-runtime
      - name: Build Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm bin/mediapipepose.spec
      - name: Check Windows executable
        if: runner.os == 'Windows'
        run: ./dist/mediapipepose/mediapipepose.exe --check-runtime
