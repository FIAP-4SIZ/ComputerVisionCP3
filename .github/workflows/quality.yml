name: Qualidade do rastreamento
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracking:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tracking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tracking/requirements-study.txt
            tracking/requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bin tests tools run.py
      - run: git diff --check
      - name: Construir decoder nativo para integração Python (Windows e Linux)
        run: |
          cmake -S ../steamvr -B ../steamvr/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ../steamvr/build --config Release --target wire_probe
      - name: MediaPipe real para decoder C++ (Linux)
        if: runner.os == 'Linux'
        run: python tools/validate_steamvr_skeleton.py --download-reference --probe ../steamvr/build/wire_probe --output steamvr-skeleton-validation.json
      - name: MediaPipe real para decoder C++ (Windows)
        if: runner.os == 'Windows'
        run: python tools/validate_steamvr_skeleton.py --download-reference --probe ../steamvr/build/Release/wire_probe.exe --output steamvr-skeleton-validation.json
      - name: Guardar ensaio de esqueleto
        uses: actions/upload-artifact@v4
        with:
          name: steamvr-skeleton-${{ runner.os }}
          path: tracking/steamvr-skeleton-validation.json
          retention-days: 7
      - name: Validar interfaces reais em tela pequena (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0
          xvfb-run -a -s "-screen 0 1280x720x24" python tools/validate_desktop.py > desktop-validation.log
      - name: Guardar resultado da interface
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: interface-linux
          path: tracking/desktop-validation.log
          retention-days: 7
      - name: Build Linux
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm bin/mediapipepose_linux.spec
      - name: Check Linux executable
        if: runner.os == 'Linux'
        run: ./dist/mediapipepose/mediapipepose --check-runtime
      - name: Validar instalador e atalho CMD (Windows)
        if: runner.os == 'Windows'
        run: |
          cmd /c install_libraries.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c mediapipepose.bat --check-runtime
          exit $LASTEXITCODE
      - name: Build Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm bin/mediapipepose.spec
      - name: Check Windows executable
        if: runner.os == 'Windows'
        run: ./dist/mediapipepose/mediapipepose.exe --check-runtime
      - name: Guardar aplicativo para validação manual
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-${{ runner.os }}
          path: tracking/dist/mediapipepose/
          retention-days: 7
