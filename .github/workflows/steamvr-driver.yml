name: Driver SteamVR de mãos
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S steamvr -B steamvr/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build steamvr/build --config Release
      - run: ctest --test-dir steamvr/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: steamvr-hands-${{ runner.os }}
          path: steamvr/build/package/mediapipe_hands/
          retention-days: 7
