<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle do rastreamento corporal</title>
</head>
<style>
  
.form-button {
	width: 200px;
	height: 50px;
	margin: 10px;}
	
.wide-button {
	width: 400px;
	height: 50px;
	margin: 10px;}
	
.form-inline {
  display: flex;
  flex-flow: row wrap;
  align-items: center;
  margin: 0px;
}
  
</style>
<body>
    <h1>Controle do rastreamento corporal</h1>
    <h2>Ajustar rotação Y</h2>
		<form action = "/roty" method = "post" class="form-inline">
			
			<p><input class="form-button" type = "submit" name = "action" value = "<<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = "<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">>" /></p>
		</form>
	<h2>Ajustar rotação X</h2>
		<form action = "/rotx" method = "post" class="form-inline">
			
			<p><input class="form-button" type = "submit" name = "action" value = "<<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = "<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">>" /></p>
		</form>
	<h2>Ajustar rotação Z</h2>
		<form action = "/rotz" method = "post" class="form-inline">
			
			<p><input class="form-button" type = "submit" name = "action" value = "<<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = "<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">>" /></p>
		</form>
	<h2>Ajustar escala</h2>
		<form action = "/scale" method = "post" class="form-inline">
			
			<p><input class="form-button" type = "submit" name = "action" value = "<<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = "<" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">" /></p>
			<p><input class="form-button" type = "submit" name = "action" value = ">>" /></p>
		</form>
	
		<form action = "/autocalib" method = "post" class="form-inline">
			<p><input class="wide-button" type = "submit" value = "Recalibrar" /></p>
		</form>
		
	<h2>Ajustar suavização</h2>
		<form action = "/smoothing" method = "post" class="form-inline">
			 <label for="suavizacao">Suavização adicional (0 a 1):</label>
			 <p><input id="suavizacao" type = "text" name = "value" value="{{smooth}}" class="form-button" /></p>
			 <p><input type = "submit" value = "Atualizar" class="form-button" name = "action" /></p>
			 <p><input class="form-button" type = "submit" name = "action" value = "<" /></p>
			 <p><input class="form-button" type = "submit" name = "action" value = ">" /></p>
		 </form>
	
</body>
</html>
